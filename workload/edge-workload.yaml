apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-workload
  namespace: edge-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-workload
  template:
    metadata:
      labels:
        app: edge-workload
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: edge-workload
  namespace: edge-lab
spec:
  selector:
    app: edge-workload
  ports:
    - port: 80
      targetPort: 80